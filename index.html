<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Watch Viral Video</title>

<style>

body{
  margin:0;
  background:#000;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

.container{
  position:relative;
  width:360px;
  max-width:95%;
}

.thumbnail{
  width:100%;
  border-radius:20px;
  display:block;
}

.play-button{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:90px;
  opacity:0.95;
  cursor:pointer;
  transition:.2s;
}

.play-button:hover{
  transform:translate(-50%,-50%) scale(1.1);
}

.text{
  position:absolute;
  bottom:25px;
  left:20px;
  right:20px;
  color:white;
  font-size:22px;
  font-weight:bold;
  text-shadow:0 2px 10px rgba(0,0,0,.7);
}

</style>
</head>

<body>

<div class="container">

<a href="https://s.shopee.co.id/902MyrOgmh" target="_blank">

<img class="thumbnail"
src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=1200&auto=format&fit=crop">

<img class="play-button"
src="https://upload.wikimedia.org/wikipedia/commons/0/04/Play_button_icon_%28black%29.svg">

<div class="text">
Watch Until The End 😳
</div>

</a>

</div>

</body>
</html>
