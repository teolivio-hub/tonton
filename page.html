<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Viral Product Landing Page</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f0f0f;
      color:white;
    }

    .container{
      max-width:1100px;
      margin:auto;
      padding:20px;
    }

    .hero{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      padding:60px 0;
      gap:40px;
    }

    .hero-text{
      flex:1;
      min-width:300px;
    }

    .hero-text h1{
      font-size:55px;
      line-height:1.1;
      margin-bottom:20px;
    }

    .hero-text span{
      color:orange;
    }

    .hero-text p{
      color:#bdbdbd;
      line-height:1.7;
      margin-bottom:30px;
    }

    .btn{
      display:inline-block;
      padding:15px 30px;
      background:orange;
      color:black;
      font-weight:bold;
      text-decoration:none;
      border-radius:15px;
      transition:.3s;
    }

    .btn:hover{
      opacity:.8;
    }

    .hero-image{
      flex:1;
      min-width:300px;
    }

    .hero-image img{
      width:100%;
      border-radius:25px;
    }

    .products{
      padding:60px 0;
    }

    .products h2{
      font-size:40px;
      margin-bottom:30px;
      text-align:center;
    }

    .product-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
    }

    .card{
      background:#1a1a1a;
      border-radius:20px;
      overflow:hidden;
      transition:.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card img{
      width:100%;
      height:250px;
      object-fit:cover;
    }

    .card-content{
